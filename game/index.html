<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>스도쿠 메이트 다운로드</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, #ffffff 0, #f5f7fb 45%, #edf1f7 100%);
    }

    main {
      width: min(100%, 460px);
      padding: 40px 32px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e6eaf1;
      border-radius: 24px;
      box-shadow: 0 20px 55px rgba(25, 39, 75, 0.1);
      backdrop-filter: blur(16px);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #edf3ff;
      color: #2563eb;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 5vw, 22px);
      line-height: 1.45;
      font-weight: 750;
      overflow-wrap: anywhere;
      letter-spacing: -0.025em;
    }

    .meta {
      margin: 10px 0 28px;
      color: #6b7280;
      font-size: 14px;
    }

    .download {
      min-height: 52px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      background: #2563eb;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .download:hover {
      background: #1d4ed8;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    .download:active {
      transform: translateY(0);
    }

    .download:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.3);
      outline-offset: 4px;
    }

    .notice {
      margin: 22px 0 0;
      padding-top: 20px;
      color: #64748b;
      font-size: 17px;
      line-height: 1.7;
      word-break: keep-all;
      border-top: 1px solid #e8edf4;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <path d="M6.75 2.75h7.5l3 3v15.5H6.75a2 2 0 0 1-2-2V4.75a2 2 0 0 1 2-2Z" fill="currentColor" opacity=".12"/>
        <path d="M14.25 2.75v3h3M8.25 11.25h5.5M8.25 14.5h5.5M8.25 17.75h3.5M6.75 2.75h7.5l3 3v15.5H6.75a2 2 0 0 1-2-2V4.75a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>스도쿠 메이트</h1>
    <p class="meta">최고의 모바일 스도쿠 앱</p>
    <a class="download" href="./app.apk" download="스도쿠 메이트 V1.apk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      다운로드
    </a>
    <p class="notice" style="color: red;">설치가 안된다면 <b>설정 -> 보안 및 개인정보 보호 -> '보안 위험 자동 차단'을 해제해주세요</b></p>
  </main>
</body>
</html>
